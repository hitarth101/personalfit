<!doctype html>

<title>PersonalFit Preview</title>

  body { margin: 0; background: #2a2d33; color: #f3f4f6; font: 14px/1.4 -apple-system, "Segoe UI", sans-serif; }

  <figure><figcaption>iPhone 18 Pro · dark (402×874)</figcaption><iframe src="/?theme=dark" width="402" height="874" title="18 Pro dark"></iframe></figure>
  <figure><figcaption>iPhone 18 Pro · light</figcaption><iframe src="/?theme=light" width="402" height="874" title="18 Pro light"></iframe></figure>
